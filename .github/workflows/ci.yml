# The suite existed but nothing ran it, so a regression could merge unnoticed.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:run

      # The published package is what users install; a missing file or a bad
      # entry point only shows up here.
      - name: Package checks
        run: npm run lint:n8n
