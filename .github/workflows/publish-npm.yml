# Publishes the node people install from n8n's community-nodes screen.
# Without this the package was published by hand, which is why npm sat on 1.0.18
# while the repository moved on.
name: Publish to npm

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Provenance is an attestation signed with the workflow's OIDC identity.
      # Without this permission `npm publish --provenance` cannot mint one, and
      # n8n rejects the package: verified community nodes have had to carry
      # provenance since 1 May 2026.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22 ships an npm new enough to publish with provenance, and to use npm
          # trusted publishing (OIDC) if that is ever configured for this package,
          # which would remove the need for NPM_TOKEN altogether.
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Fail here with a readable message rather than at publish time with a 401.
      - name: Check npm credentials
        run: |
          if [ -z "${{ secrets.NPM_TOKEN }}" ]; then
            echo "::error::NPM_TOKEN is not set on this repository."
            echo "::error::Without it the community node cannot be published and n8n users keep installing the previous version."
            echo "::error::Alternatively, configure npm trusted publishing for n8n-nodes-8kit and this workflow can publish over OIDC with no token at all."
            exit 1
          fi

      - run: npm ci

      - name: Test
        run: npx vitest run

      - name: Build
        run: npm run build

      # A tag that does not match package.json would publish the wrong version.
      - name: Check the tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $TAG does not match package.json version $PKG."
            exit 1
          fi

      - name: Publish
        # --provenance is what n8n's scanner checks for. Publishing without it
        # produces a package that installs fine but fails verification.
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
