services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=UTC
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=false
    volumes:
      - n8n_data:/home/node/.n8n
      - .:/src/n8n-nodes-8kit:ro   # the built package; run ./start-n8n.sh (it builds first)
    entrypoint: >
      sh -c "
        mkdir -p /home/node/.n8n/nodes &&
        cd /home/node/.n8n/nodes &&
        npm init -y > /dev/null 2>&1 &&
        npm install /src/n8n-nodes-8kit &&
        cd / &&
        exec n8n start
      "
    networks:
      - n8n_network

volumes:
  n8n_data:
    driver: local

networks:
  n8n_network:
    driver: bridge
